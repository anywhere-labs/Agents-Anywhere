# frps for port preview (data plane only; Agents Anywhere decides who may open what).
#
# - Devices' frpc connect through the gateway: wss://frp.<preview domain>/~!frp -> bindPort.
# - Visitors reach previews through the gateway: https://<slug>.<preview domain> -> vhostHTTPPort,
#   after preview-auth has checked them. Neither port is published outside the Compose network.
# - Every frpc login and proxy registration is checked by the Server (httpPlugins), on the
#   Compose network only (the gateway answers 404 for /api/v3/internal/*). The plugin has no
#   header setting, so AGENT_SERVER_PREVIEW_INTERNAL_TOKEN goes in the userinfo of `addr`: Go's
#   HTTP client sends it as `Authorization: Basic`, never in the request path, so access logs do
#   not record it. Without the token every login is refused. The token must be URL-safe
#   (`openssl rand -hex 32`).
bindAddr = "0.0.0.0"
bindPort = 7000
vhostHTTPPort = 8081
subDomainHost = "{{ .Envs.AGENT_SERVER_PREVIEW_DOMAIN }}"
vhostHTTPTimeout = 60
transport.maxPoolCount = 5
log.to = "console"
log.level = "warn"

[[httpPlugins]]
name = "agents-anywhere"
addr = "frps:{{ .Envs.AGENT_SERVER_PREVIEW_INTERNAL_TOKEN }}@server-next:8000"
path = "/api/v3/internal/preview/frps"
ops = ["Login", "NewProxy", "CloseProxy"]
