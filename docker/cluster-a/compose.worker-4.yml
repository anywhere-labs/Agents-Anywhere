# Overlay for the 8-vCPU / 16-GiB fourth application node.
# docker compose -f compose.yml -f compose.worker-4.yml up -d server
services:
  server:
    environment:
      AGENT_SERVER_WORKERS: 8
      AGENT_SERVER_EVENT_WORKERS: 1
      AGENT_SERVER_INSTANCE_ID: cluster-a-worker-4
    cpus: 8.0
    mem_limit: 14g
