# Overlay for the 8-vCPU / 16-GiB third application node.
# docker compose -f compose.yml -f compose.worker-3.yml up -d server
services:
  server:
    environment:
      AGENT_SERVER_WORKERS: 8
      AGENT_SERVER_EVENT_WORKERS: 1
      AGENT_SERVER_INSTANCE_ID: cluster-a-worker-3
    cpus: 8.0
    mem_limit: 14g
