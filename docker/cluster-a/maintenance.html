    :root { --background: #fff; --foreground: #171717; --muted: #737373; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--foreground); font-family: Geist, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
    .page { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
    header { min-height: 68px; display: flex; align-items: center; padding: 20px 32px; }
    .wordmark { font-family: Caveat, "Snell Roundhand", cursive; font-size: 20px; font-weight: 500; letter-spacing: 0; line-height: 1; white-space: nowrap; }
    main { flex: 1; display: flex; align-items: center; width: 100%; max-width: 1600px; margin: 0 auto; padding: 76px calc(clamp(24px, 4.5vw, 72px) + clamp(0px, 3vw, 48px)); }
    .content { width: 100%; }
    h1 { margin: 0; font-size: clamp(42px, 5.1vw, 76px); font-weight: 500; line-height: 1.18; letter-spacing: -.055em; }
    .description { margin: 28px 0 0; max-width: 670px; color: var(--muted); font-size: 17px; font-weight: 400; line-height: 1.85; }
    .english-title { margin: 18px 0 0; font-size: clamp(22px, 2.5vw, 36px); font-weight: 500; line-height: 1.2; letter-spacing: -.035em; }
    .description-en { margin-top: 10px; }
    .actions { margin-top: 40px; }
    .button { display: inline-flex; justify-content: center; align-items: center; gap: 12px; min-height: 44px; padding: 0 20px; border: 1px solid transparent; border-radius: 9999px; font-size: 14px; font-weight: 500; text-decoration: none; background: var(--foreground); color: var(--background); }
    .button:hover { opacity: .8; }
    .button:focus-visible { outline: 2px solid var(--foreground); outline-offset: 5px; }
    .button svg { width: 16px; height: 16px; }
    footer { padding: 20px clamp(24px, 4.5vw, 72px) 24px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    @media (max-width: 899px) {
      main { padding-inline: calc(clamp(24px, 4.5vw, 72px) + 20px); }
      h1 { font-size: clamp(40px, 6.8vw, 60px); }
    }
    @media (max-width: 599px) {
      header { padding-inline: 24px; }
      main { padding: 60px 24px; }
      h1 { font-size: clamp(36px, 9.2vw, 50px); letter-spacing: -.06em; }
      .description { font-size: 15px; margin-top: 26px; }
      .actions { margin-top: 32px; }
    }
    @media (max-width: 359px) {
      main { padding-inline: 20px; }
      h1 { font-size: 34px; }
    }
    @media (prefers-color-scheme: dark) {
      :root { --background: #171717; --foreground: #fafafa; --muted: #a3a3a3; }
    }
  </style>
</head>
