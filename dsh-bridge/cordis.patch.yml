- insert:
    - id: agents-anywhere-bridge
      name: '@agents-anywhere/dsh-bridge'
      config:
        stateRoot: !!js dshHomePath('agents-anywhere', 'bridge')
        maxFrameBytes: 8388608
        readRequestTimeoutMs: 30000
        writeRequestTimeoutMs: 60000
        shutdownTimeoutMs: 15000
        maxListLimit: 500
        maxCommandLimit: 200
        maxPendingInteractions: 64
