<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agents Anywhere Dev Control</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0c0e;
        color: #f4f4f5;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #0b0c0e; }
      main { width: min(760px, calc(100% - 32px)); margin: 64px auto; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
      h1 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: 0; }
      .endpoint { color: #8f949d; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
      section { border-top: 1px solid #292c31; }
      .service { display: grid; grid-template-columns: 1fr auto; align-items: center; min-height: 72px; border-bottom: 1px solid #292c31; }
      .service-name { display: flex; align-items: center; gap: 10px; font-weight: 600; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #62666e; box-shadow: 0 0 0 3px #17191d; }
      .dot.online { background: #22c993; }
      .dot.offline { background: #ef5b63; }
      .state { color: #969ba4; font-size: 13px; }
      button { min-height: 38px; border: 1px solid #383c43; border-radius: 7px; background: #181a1f; color: #f4f4f5; padding: 0 14px; font: inherit; font-size: 14px; cursor: pointer; }
      button:hover { background: #22252b; border-color: #50555e; }
      button:disabled { cursor: wait; opacity: .55; }
      .primary { background: #f1f2f3; color: #111317; border-color: #f1f2f3; }
      .primary:hover { background: #dfe1e4; border-color: #dfe1e4; }
      .controls { padding: 24px 0; }
      label { display: block; margin-bottom: 9px; color: #b8bbc1; font-size: 13px; }
      textarea { display: block; width: 100%; min-height: 112px; resize: vertical; border: 1px solid #343840; border-radius: 7px; background: #111317; color: #e9eaec; padding: 12px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; outline: none; }
      textarea:focus { border-color: #6f7680; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
      .message { min-height: 44px; margin-top: 18px; border-left: 2px solid #3b3f46; padding: 11px 0 11px 14px; color: #a8acb4; font-size: 13px; line-height: 1.5; }
      .message.error { border-color: #ef5b63; color: #ff9da3; }
      .message.success { border-color: #22c993; color: #7be0bd; }
      @media (max-width: 560px) {
        main { margin: 32px auto; }
        header { align-items: start; flex-direction: column; }
        .actions button { flex: 1 1 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Agents Anywhere Dev Control</h1>
        <div class="endpoint">127.0.0.1:8765</div>
      </header>

      <section aria-label="服务状态">
        <div class="service">
          <div class="service-name"><span class="dot" data-dot="server"></span>Server · 8000</div>
          <div class="state" data-state="server">检查中</div>
        </div>
        <div class="service">
          <div class="service-name"><span class="dot" data-dot="web"></span>Web · 5174</div>
          <div class="state" data-state="web">检查中</div>
        </div>
        <div class="service">
          <div class="service-name"><span class="dot" data-dot="connector"></span>Connector</div>
          <div class="state" data-state="connector">检查中</div>
        </div>
        <div class="service">
          <div class="service-name"><span class="dot" data-dot="postgres"></span>PostgreSQL · 55432</div>
          <div class="state" data-state="postgres">检查中</div>
        </div>
        <div class="service">
          <div class="service-name"><span class="dot" data-dot="redis"></span>Redis · 56379</div>
          <div class="state" data-state="redis">检查中</div>
        </div>
      </section>

      <div class="controls">
        <label for="credential">Connector 凭据（首次启动时粘贴）</label>
        <textarea id="credential" autocomplete="off" spellcheck="false" placeholder="粘贴从 Agents Anywhere 复制的 Connector 凭据；重启已有 Connector 时可留空"></textarea>
        <div class="actions">
          <button type="button" data-target="server">↻ 重启后端</button>
          <button type="button" class="primary" data-target="connector">↻ 启动 / 重启 Connector</button>
        </div>
        <div class="message" id="message" aria-live="polite">就绪</div>
      </div>
    </main>

    <script>
      const buttons = [...document.querySelectorAll("button[data-target]")];
      const credential = document.querySelector("#credential");
      const message = document.querySelector("#message");

      function renderStatus(status) {
        for (const name of ["server", "web", "connector", "postgres", "redis"]) {
          const online = Boolean(status[name]);
          const dot = document.querySelector(`[data-dot="${name}"]`);
          const label = document.querySelector(`[data-state="${name}"]`);
          dot.className = `dot ${online ? "online" : "offline"}`;
          label.textContent = online ? "运行中" : "已停止";
        }
      }

      async function refreshStatus() {
        try {
          const response = await fetch("/api/status", { cache: "no-store" });
          renderStatus(await response.json());
        } catch {
          for (const name of ["server", "web", "connector", "postgres", "redis"]) {
            document.querySelector(`[data-dot="${name}"]`).className = "dot offline";
            document.querySelector(`[data-state="${name}"]`).textContent = "不可达";
          }
        }
      }

      async function restart(target) {
        buttons.forEach((button) => { button.disabled = true; });
        message.className = "message";
        message.textContent = target === "server" ? "正在重启后端…" : "正在启动 Connector…";
        try {
          const response = await fetch("/api/restart", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              target,
              credential: target === "server" ? null : credential.value.trim() || null,
            }),
          });
          const result = await response.json();
          if (!response.ok || !result.ok) throw new Error(result.error || "重启失败");
          renderStatus(result.status);
          credential.value = "";
          message.className = "message success";
          message.textContent = "重启完成";
        } catch (error) {
          message.className = "message error";
          message.textContent = error instanceof Error ? error.message : "重启失败";
        } finally {
          buttons.forEach((button) => { button.disabled = false; });
        }
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => restart(button.dataset.target));
      });
      refreshStatus();
      setInterval(refreshStatus, 3000);
    </script>
  </body>
</html>
