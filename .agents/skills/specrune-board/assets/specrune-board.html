  function openDrawer(kind, title, bodyHtml, push) {
    const d = S.drawer;
    if (push) d.stack.push({ kind, title, body: bodyHtml });
    $('drawer-kind').textContent = kind;
    $('drawer-kind').className = 'badge plain';
    $('drawer-body').innerHTML = title ? '<h1 class="dr-title">' + esc(title) + '</h1>' : '';
    $('drawer-body').innerHTML += bodyHtml;
    $('btn-back').style.display = d.stack.length > 1 ? '' : 'none';
    $('curtain').classList.add('open');
    $('drawer').classList.add('open');
    $('drawer-body').scrollTop = 0;
  }
  function closeDrawer() {
    S.drawer.stack = [];
    $('curtain').classList.remove('open');
    $('drawer').classList.remove('open');
  }
  function drawerBack() {
    const d = S.drawer;
    if (d.stack.length < 2) return;
    d.stack.pop();
    const prev = d.stack[d.stack.length - 1];
    $('drawer-kind').textContent = prev.kind;
    $('drawer-body').innerHTML = '<h1 class="dr-title">' + esc(prev.title) + '</h1>' + prev.body;
    $('btn-back').style.display = d.stack.length > 1 ? '' : 'none';
    $('drawer-body').scrollTop = 0;
  }

    return '<div class="meta-grid">' + pairs.map(([k, v]) => metaCell(k, v == null || v === '' ? '—' : v)).join('') + '</div>';

      parsed.items.map((it) => '<tr><td class="mono">' + esc(it.file || '—') + '</td><td>' + esc(it.reason || '—') +

  function openTask(slug, archiveMonth, push) {

      ['状态', statusLabel(t.status) + (t.raw.status === 'done' ? '（磁盘值 done，读侧按 completed 显示）' : '')],
      ['优先级', t.priority],
      ['创建', t.createdAt],
      ['完成', t.completedAt],
      ['负责人', t.assignee],
      ['创建者', t.creator],
      ['包', t.package],
      ['分支', t.branch],
      ['commit', t.commit],
      ['PR', t.prUrl],
      ['父任务', t.parent],

      html += '<div class="sec"><div class="sec-title">描述</div><div class="md">' + mdToHtml(t.description) + '</div></div>';

    html += '<div class="sec"><div class="sec-title">产物' +
      (arts.length ? ' · ' + arts.length + ' 份' : '') + '</div>';
    html += arts.length
      ? arts.map(([name, body], i) => (
        '<details class="art"' + (name === 'prd.md' || i === 0 ? ' open' : '') + '>' +
        '<summary>' + esc(name) + '</summary><div class="art-body">' + md(body) + '</div></details>'

    html += '<div class="sec"><div class="sec-title">规范清单</div>' +
      manifestTable('implement.jsonl', t.implementList) +

  // =========================================================================
  // 8. 全局搜索

  function buildSearchIndex() {
    const idx = [];
    for (const sp of S.specs) {
      idx.push({ kind: '规范', title: sp.fileKey + '.md', sub: sp.group + ' · ' + sp.blocks.length + ' 块',
        hay: (sp.fileKey + ' ' + sp.group + ' ' + sp.body.slice(0, 4000)).toLowerCase(), run: () => openSpecFile(sp.fileKey, true) });
      for (const b of sp.blocks) {
        idx.push({ kind: '契约', title: b.title, sub: sp.fileKey + '# ' + b.slug,
          hay: (b.title + ' ' + b.slug + ' ' + b.text.slice(0, 3000)).toLowerCase(), run: () => openBlock(b, true) });
      }
    }
    for (const t of [...S.tasks, ...S.archived]) {
      idx.push({ kind: '任务', title: t.title, sub: t.slug + ' · ' + statusLabel(t.status) + (t.archive ? ' · 归档 ' + t.archive : ''),
        hay: (t.slug + ' ' + t.title + ' ' + t.description + ' ' + t.assignee + ' ' + t.branch).toLowerCase(),
        run: () => openTask(t.slug, t.archive, true) });
    }
    for (const s of S.sessions) {
      idx.push({ kind: '会话', title: s.title, sub: '#' + s.num + ' · ' + fmtDate(s.createdRaw) + (s.task ? ' · ' + s.task : ''),
        hay: (s.id + ' ' + s.title + ' ' + s.task + ' ' + s.developer + ' ' + s.platform + ' ' + s.body.slice(0, 4000)).toLowerCase(),
        run: () => openSession(s.fileId, true) });
    }
    S.searchIndex = idx;
  }

  function runSearch(q) {
    const term = q.trim().toLowerCase();
    if (!term) return [];
    const parts = term.split(/\s+/).filter(Boolean);
    const hits = [];
    for (const item of S.searchIndex) {
      let ok = true;
      for (const p of parts) { if (item.hay.indexOf(p) < 0) { ok = false; break; } }
      if (!ok) continue;
      hits.push(item);
      if (hits.length >= 60) break;
    }
    return hits;
  }

  function renderPopover() {
    const q = $('query').value;
    const pop = $('popover');
    if (!q.trim()) { pop.classList.remove('open'); pop.innerHTML = ''; S.searchHits = []; return; }
    const hits = runSearch(q);
    S.searchHits = hits;
    S.searchSel = 0;
    if (!hits.length) {
      pop.innerHTML = '<div class="pop-empty">没有匹配的规范 / 任务 / 会话</div>';
      pop.classList.add('open');
      return;
    }
    pop.innerHTML = hits.slice(0, 40).map((h, i) => (
      '<div class="pop-item' + (i === S.searchSel ? ' selected' : '') + '" data-hit="' + i + '">' +
      '<span class="pop-kind">' + esc(h.kind) + '</span>' +
      '<span class="pop-main"><span class="pop-title">' + esc(h.title) + '</span>' +
      '<span class="pop-sub">' + esc(h.sub) + '</span></span></div>'
    )).join('');
    pop.classList.add('open');
  }

  function openHit(i) {
    const h = S.searchHits[i];
    if (!h) return;
    $('popover').classList.remove('open');
    h.run();
  }

  // =========================================================================
  // 9. 事件接线
  // =========================================================================

  function switchView(name) {
    S.view = name;
    document.querySelectorAll('.deck-tab').forEach((b) => b.classList.toggle('active', b.dataset.view === name));
    document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === 'view-' + name));
  }

  function wire() {
    document.querySelectorAll('.deck-tab').forEach((b) => {
      b.addEventListener('click', () => switchView(b.dataset.view));
    });

    // --- 目录接入 ---
    // 常规选择器流程：`btn-pick` 与恢复区块的「换一个目录」共用同一条路径。
    async function pickDirectory() {
      if (typeof window.showDirectoryPicker !== 'function') {
        toast('当前浏览器不支持 File System Access API，改用快照模式');
        $('dir-input').click();
        return;
      }
      let handle;
      try {
        // mode:'read' 是只读边界：看板全程不请求任何写权限。
        handle = await window.showDirectoryPicker({ mode: 'read', id: 'specrune-board' });
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        toast('目录直读不可用（' + ((err && err.message) || err) + '），改用快照模式');
        $('dir-input').click();
        return;
      }
      try {
        const cands = await collectFsa(handle);
        S.mode = 'fsa';
        S.handle = handle;
        const before = S.scannedAt;
        await loadFromCandidates(cands, { sourceLabel: handle.name });
        // 只有真正接入了 SpecRune 仓库才记：选错目录（locate 失败）不该被记住。
        if (S.scannedAt !== before) rememberSave(handle);
      } catch (err) {
        toast('扫描失败：' + ((err && err.message) || err));
      }
    }
    $('btn-pick').addEventListener('click', pickDirectory);

    // 恢复区块：仅在 prompt 分支出现过，点击授权是唯一允许的 requestPermission 路径。
    $('btn-restore').addEventListener('click', async () => {
      const rec = restorePending;
      if (!rec || !rec.handle) return;
      let req;
      try {
        req = rec.handle.requestPermission ? await rec.handle.requestPermission({ mode: 'read' }) : 'granted';
      } catch (err) {
        hideRestorePrompt();
        toast('授权失败：' + ((err && err.message) || err));
        return;
      }
      // 没拿到授权就退回常规接入界面（R3 的「否则」分支），不留下一个点不动的按钮。
      if (req !== 'granted') { hideRestorePrompt(); toast('未获得目录读取授权'); return; }
      await loadRemembered(rec.handle, rec.name, false);
    });
    // 「换一个目录」：收起恢复区块，直接走常规选择器（与 btn-pick 同一条路径）。
    $('btn-change').addEventListener('click', () => { hideRestorePrompt(); pickDirectory(); });
    $('btn-forget').addEventListener('click', async () => {
      await rememberClear();
      hideRestorePrompt();
      toast('已忘记上次的目录');
    });

    $('btn-snapshot').addEventListener('click', () => $('dir-input').click());
    $('dir-input').addEventListener('change', async (e) => {
      const files = e.target.files;
      if (!files || !files.length) return;
      const cands = collectSnapshot(files);
      const label = stripRootSegment(files[0].webkitRelativePath || '').split('/')[0] || '快照';
      S.mode = 'snapshot';
      S.handle = null;
      await loadFromCandidates(cands, { sourceLabel: files[0].webkitRelativePath ? files[0].webkitRelativePath.split('/')[0] : label });
      e.target.value = '';
    });

    $('beacon-rescan').addEventListener('click', async () => {
      if (S.mode !== 'fsa' || !S.handle) return;
      try {
        const perm = S.handle.queryPermission ? await S.handle.queryPermission({ mode: 'read' }) : 'granted';
        if (perm !== 'granted' && S.handle.requestPermission) {
          const req = await S.handle.requestPermission({ mode: 'read' });
          if (req !== 'granted') { toast('未获得目录读取授权'); return; }
        }
        setBeacon('scanning');
        const cands = await collectFsa(S.handle);
        await loadFromCandidates(cands, { sourceLabel: S.handle.name });
        rememberSave(S.handle);
        toast('已重新扫描');
      } catch (err) {
        toast('重新扫描失败：' + ((err && err.message) || err));
        setBeacon('ready');
      }
    });

    // --- 拖拽 ---
    let dragDepth = 0;
    window.addEventListener('dragenter', (e) => {
      if (!e.dataTransfer || !e.dataTransfer.types || e.dataTransfer.types.indexOf('Files') < 0) return;
      dragDepth++;
      document.body.classList.add('drop-active');
    });
    window.addEventListener('dragleave', () => {
      dragDepth = Math.max(0, dragDepth - 1);
      if (!dragDepth) document.body.classList.remove('drop-active');
    });
    window.addEventListener('dragover', (e) => { e.preventDefault(); });
    window.addEventListener('drop', async (e) => {
      e.preventDefault();
      dragDepth = 0;
      document.body.classList.remove('drop-active');
      if (!e.dataTransfer) return;
      try {
        const cands = await collectDropped(e.dataTransfer);
        S.mode = 'snapshot';
        S.handle = null;
        await loadFromCandidates(cands, { sourceLabel: '拖入的文件夹' });
      } catch (err) {
        toast('拖拽读取失败：' + ((err && err.message) || err));
      }
    });

    // --- 抽屉 ---
    $('btn-close').addEventListener('click', closeDrawer);
    $('btn-back').addEventListener('click', drawerBack);
    $('curtain').addEventListener('click', closeDrawer);
    $('chip-warn').addEventListener('click', openWarnings);

    // 抽屉内的委托点击：契约块 / 规范文件 / 任务 / 会话 / req 引用。
    $('drawer-body').addEventListener('click', (e) => {
      const refEl = e.target.closest('[data-ref]');
      if (refEl && refEl.classList.contains('req-ref')) {
        const raw = refEl.dataset.ref;
        const hash = raw.lastIndexOf('#');
        if (hash < 0) return;
        const target = raw.slice(0, hash);

        // 抽屉内点的是站内引用（没有 data-target），按 target#slug 解析。
        const segs = target.split('/');
        const file = segs.pop();
        const prefix = segs.join('/');
        const sp = (prefix && S.byPath.get(prefix + '/' + file)) || (S.byBase.get(file) || [])[0];
        if (!sp) { toast('悬空引用：找不到 ' + target); return; }
        const b = sp.blockBySlug.get(raw.slice(hash + 1));
        if (!b) { toast('悬空引用：' + target + ' 中没有 #' + raw.slice(hash + 1)); return; }
        openBlock(b, true);
        return;
      }
      const warnEl = e.target.closest('[data-open-warnings]');
      if (warnEl) { openWarnings(); return; }
      const taskEl = e.target.closest('[data-task]');
      if (taskEl) {
        const [slug, month] = taskEl.dataset.task.split('|');
        openTask(slug, month || null, true);
        return;
      }
      const blockEl = e.target.closest('[data-block]');
      if (blockEl) {
        const id = blockEl.dataset.block;
        const hash = id.lastIndexOf('#');
        const sp = S.byPath.get(id.slice(0, hash));
        const b = sp && sp.blockBySlug.get(id.slice(hash + 1));
        if (b) openBlock(b, true); else toast('找不到契约块 ' + id);
        return;
      }
      const fileEl = e.target.closest('[data-file]');
      if (fileEl) { openSpecFile(fileEl.dataset.file, true); return; }
      const sessEl = e.target.closest('[data-session]');
      if (sessEl) { openSession(sessEl.dataset.session, true); return; }
    });

    // 主区委托点击。
    document.querySelector('main').addEventListener('click', (e) => {
      const goto = e.target.closest('[data-goto]');
      if (goto) { switchView(goto.dataset.goto); return; }
      const warn = e.target.closest('[data-open-warnings]');
      if (warn) { openWarnings(); return; }
      const task = e.target.closest('[data-task]');
      if (task) { const p = task.dataset.task.split('|'); openTask(p[0], p[1] || null, true); return; }
      const sess = e.target.closest('[data-session]');
      if (sess) { openSession(sess.dataset.session, true); return; }
      const block = e.target.closest('[data-block]');
      if (block) {
        const id = block.dataset.block;
        const hash = id.lastIndexOf('#');
        const sp = S.byPath.get(id.slice(0, hash));
        const b = sp && sp.blockBySlug.get(id.slice(hash + 1));
        if (b) openBlock(b, true);
        return;
      }
      const file = e.target.closest('[data-file]');
      if (file) { openSpecFile(file.dataset.file, true); return; }
      const layer = e.target.closest('[data-layer]');
      if (layer) { S.specLayer = layer.dataset.layer; renderSpec(); return; }
      const pane = e.target.closest('[data-pane]');
      if (pane) { S.specPane = pane.dataset.pane; renderSpec(); return; }
      const scope = e.target.closest('[data-scope]');
      if (scope) { S.taskScope = scope.dataset.scope; renderTasks(); return; }
      const status = e.target.closest('[data-status]');
      if (status) { S.taskStatus = status.dataset.status; renderTasks(); return; }
      const order = e.target.closest('[data-order]');
      if (order) { S.sessionOrder = order.dataset.order; renderSessions(); return; }
    });

    // --- 搜索 ---
    const q = $('query');
    q.addEventListener('input', renderPopover);
    q.addEventListener('focus', renderPopover);
    q.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); S.searchSel = Math.min(S.searchSel + 1, S.searchHits.length - 1); renderPopover(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); S.searchSel = Math.max(S.searchSel - 1, 0); renderPopover(); }
      else if (e.key === 'Enter') { e.preventDefault(); openHit(S.searchSel); }
      else if (e.key === 'Escape') { q.value = ''; renderPopover(); q.blur(); }
    });
    $('popover').addEventListener('mousedown', (e) => {
      const item = e.target.closest('[data-hit]');
      if (item) { e.preventDefault(); openHit(Number(item.dataset.hit)); }
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.hud-search')) $('popover').classList.remove('open');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if ($('drawer').classList.contains('open')) { closeDrawer(); return; }
      }
      if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        $('query').focus();
        $('query').select();
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        $('query').focus();
        $('query').select();
      }
    });

    // 数据由 CLI 在会话边界批量写入，不做定时轮询；聚焦时提示一次可能已过期。
    window.addEventListener('focus', () => {
      if (!S.scannedAt || S.staleHinted) return;
      if (Date.now() - S.scannedAt > 60000 && S.mode === 'fsa') {
        S.staleHinted = true;
        toast('数据可能已变，点右上角「重新扫描」刷新');
      }
    });

    // 尝试复用上次目录。不 await：加载是异步的，不该阻塞首帧与事件接线。
    restoreLast();
  }

  wire();
})();
</script>
</body>
</html>
