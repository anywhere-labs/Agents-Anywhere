name: Android APK

# Cloud-only build for the Android client. Produces a debug APK (installable over
# other debug builds signed with the same personal key) and a minified release APK.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag override (defaults to v<version>-tablet.<run>)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Exposed at job level so step conditions can test it: the `secrets` context
      # itself is not reliably available inside `if:` expressions.
      AA_KEYSTORE_BASE64: ${{ secrets.AA_KEYSTORE_BASE64 }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode personal signing key
        if: env.AA_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$AA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/agents-anywhere-personal.jks"
          echo "AA_KEYSTORE_PATH=$RUNNER_TEMP/agents-anywhere-personal.jks" >> "$GITHUB_ENV"

      - name: Assemble debug + release
        working-directory: android
        env:
          AA_KEYSTORE_PASSWORD: ${{ secrets.AA_KEYSTORE_PASSWORD }}
          AA_KEY_ALIAS: ${{ secrets.AA_KEY_ALIAS }}
          AA_KEY_PASSWORD: ${{ secrets.AA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            :app:assembleDebug :app:assembleRelease

      - name: Verify signature
        if: env.AA_KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          set -uo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1 | head -20
            echo "exit=$?"
          done

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p out
          VERSION=$(grep -m1 'versionName = ' android/app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/AgentsAnywhere-${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "out/AgentsAnywhere-${VERSION}-release.apk"
          ls -lh out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agents-anywhere-android-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: github.event_name == 'push' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || format('v{0}-tablet.{1}', '2.1.1', github.run_number) }}
          name: Agents Anywhere Android ${{ github.run_number }}
          body: |
            Tablet-adaptive Android build (two-pane workspace, IME/dark-mode fixes,
            performance pass). Signed with the personal release key stored in this
            repository's Actions secrets, so every subsequent build installs as an
            in-place update of this one.
          files: out/*.apk
          prerelease: true
