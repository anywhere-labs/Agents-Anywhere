name: DSH Bridge Next

on:
  pull_request:
    paths:
      - dsh-bridge-next/**
      - connector/**
      - server/**
      - web-next/**
      - desktop-workbench/**
      - contracts/**
      - .github/workflows/dsh-bridge-next.yml
  push:
    branches:
      - main
      - v2
      - feat/benson-0905
      - codex/connector-owned-lifecycle
      - codex/dsh-before-images
      - codex/dsh-features-with-sync-fix
    paths:
      - dsh-bridge-next/**
      - connector/**
      - server/**
      - web-next/**
      - desktop-workbench/**
      - contracts/**
      - .github/workflows/dsh-bridge-next.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-bridge-next-${{ github.ref }}
  cancel-in-progress: true

env:
  # This repository intentionally does not commit Yarn or uv lockfiles.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  # Headless checks do not need an Electron binary or dependency install scripts.
  YARN_ENABLE_SCRIPTS: "false"

jobs:
  runtime:
    name: Plugin and Python integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.12"
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare Python integration fixtures
        run: |
          uv sync --project connector
          uv sync --project server
      - name: Install plugin dependencies
        working-directory: dsh-bridge-next
        env:
          # Validate explicitly pinned DSH release candidates immediately after publication.
          YARN_NPM_MINIMAL_AGE_GATE: "0"
        run: corepack yarn install
      - name: Typecheck, build and test plugin
        working-directory: dsh-bridge-next
        run: corepack yarn check
      - name: Test Connector DSH and ownership flows
        working-directory: connector
        run: >-
          uv run --frozen pytest tests/test_dsh*.py
          tests/test_runtime_owner.py tests/test_connector_control.py
          tests/test_connector_ownership_rpc.py tests/test_runtime_control_v2.py
          tests/test_connector_runtime.py -q
      - name: Test Server runtime, onboarding and attachment flows
        working-directory: server
        run: >-
          uv run --frozen pytest
          tests/test_announcements.py
          tests/test_architecture_boundaries.py
          tests/test_attachment_mime_policy.py
          tests/test_static_path_safety.py
          tests/test_session_refresh_lock.py
          tests/test_session_inventory.py
          tests/test_connector_deletion.py
          tests/test_runtime_deletion.py
          tests/test_runtime_config.py
          tests/test_runtime_instances_lifecycle.py
          tests/test_runtime_discovery_recovery.py
          tests/test_runtime_discovery_connection.py
          tests/test_connector_ingress_dispatch.py
          tests/test_connector_rpc_manager.py
          tests/test_plugin_onboarding.py
          tests/test_device_data_storage.py
          tests/test_device_runtime_repository.py
          tests/test_effective_capabilities.py
          tests/test_database_migrations.py -q
      - name: Test live session capability admission and recovery
        working-directory: server
        run: >-
          uv run --frozen pytest tests/test_backend_mvp.py
          -k 'capabilit or send_message or running_tool_item or patch_session_selections or steer or interrupt or runtime_command or interaction_respond'
          -q

  clients:
    name: ${{ matrix.surface }} headless checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: Web
            directory: web-next
          - surface: Desktop
            directory: desktop-workbench
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Enable Corepack
        run: corepack enable
      - name: Install client dependencies
        run: corepack yarn install
      - name: Verify Web
        if: matrix.surface == 'Web'
        run: |
          corepack yarn test
          corepack yarn typecheck
          corepack yarn protocol:check
      - name: Verify Desktop renderer and main process
        if: matrix.surface == 'Desktop'
        run: |
          corepack yarn workspace agents-anywhere-desktop-renderer test
          corepack yarn renderer:typecheck
          corepack yarn workspace agents-anywhere-desktop-renderer protocol:check
          corepack yarn test:main
