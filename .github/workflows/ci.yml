name: CI

# One workflow for every headless-checkable component. The `changes` job looks
# at the changed paths and turns on only the jobs that can be affected,
# including downstream consumers: the DSH plugin tests execute Connector and
# Server code, and the Server tests import the Connector package.

on:
  pull_request:
  push:
    branches:
      - main
      - v2
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to execute
        type: choice
        options: [all, server]
        default: all
      server_workers:
        description: Server pytest workers
        type: choice
        options: ['2', '4', '1']
        default: '2'
      server_mode:
        description: Full suite or selection shadow comparison
        type: choice
        options: [full, shadow]
        default: full
      server_sample_change:
        description: Benchmark a harmless announcement function edit in this checkout
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  # This repository intentionally does not commit Yarn or uv lockfiles.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  # Headless checks do not need an Electron binary or dependency install scripts.
  YARN_ENABLE_SCRIPTS: "false"
  UV_DEFAULT_INDEX: https://pypi.org/simple
  UV_VERSION: 0.12.3
  PYTHON_VERSION: "3.12"
  NODE_VERSION: 22.23.2

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plugin: ${{ steps.paths.outputs.plugin }}
      connector: ${{ steps.paths.outputs.connector }}
      server: ${{ steps.paths.outputs.server }}
      web: ${{ steps.paths.outputs.web }}
      desktop: ${{ steps.paths.outputs.desktop }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Select checks for changed paths
        id: paths
        shell: bash
        env:
          CHECK_SCOPE: ${{ inputs.scope }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          plugin=false
          connector=false
          server=false
          web=false
          desktop=false

          run_everything() {
            echo "::notice::$1; running every check"
            plugin=true
            connector=true
            server=true
            web=true
            desktop=true
          }

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$CHECK_SCOPE" == server ]]; then
              server=true
            else
              run_everything "manual run"
            fi
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            # A push that creates a branch has no `before` commit to diff against.
            run_everything "no base commit"
          else
            # Only the two commits are needed for a tree diff.
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths"
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/*|.github/actions/*|contracts/*)
                  run_everything "shared file changed: $path"
                  ;;
                dsh-bridge-next/*) plugin=true ;;
                # Plugin integration tests run the Connector's DSH probe and the
                # Server tests import the Connector package.
                connector/*) connector=true; server=true; plugin=true ;;
                server/*) server=true; plugin=true ;;
                web-next/*) web=true ;;
                desktop-workbench/*) desktop=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi

          for scope in plugin connector server web desktop; do
            echo "$scope=${!scope}" >> "$GITHUB_OUTPUT"
            echo "$scope: ${!scope}"
          done

  plugin:
    name: DSH plugin
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agents_anywhere_test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The plugin's integration tests run the Connector's DSH probes, which build
      # the Server in-process against a throwaway database (see server/tests/conftest.py).
      AGENT_SERVER_TEST_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agents_anywhere_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install plugin dependencies
        uses: ./.github/actions/setup-yarn
        with:
          project: dsh-bridge-next
          node-version: ${{ env.NODE_VERSION }}
        env:
          # Validate explicitly pinned DSH release candidates immediately after publication.
          YARN_NPM_MINIMAL_AGE_GATE: "0"
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            connector/pyproject.toml
            server/pyproject.toml
      - name: Prepare Python integration fixtures
        run: |
          uv sync --project connector
          uv sync --project server
          uv pip install --python server/.venv/bin/python --editable ./connector
      - name: Typecheck, build and test plugin
        working-directory: dsh-bridge-next
        env:
          # Nested Python probes reuse the prepared environments, without repeated resolution.
          UV_NO_SYNC: "true"
        run: corepack yarn check

  connector:
    name: Connector tests
    needs: changes
    if: needs.changes.outputs.connector == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: connector/pyproject.toml
      - name: Install Connector dependencies
        run: uv sync --project connector
      - name: Test Connector
        working-directory: connector
        # `timeout` ends a stalled run with the faulthandler stacks still in the
        # log; the job timeout alone would discard them.
        run: timeout --kill-after=30s 900 uv run --no-sync pytest -q --durations=20 -o faulthandler_timeout=120

  acp:
    name: ACP coordination (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.connector == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Connector dependencies
        run: uv sync --project connector
      - name: Verify actual ACP transport and ownership
        working-directory: connector
        shell: bash
        run: |
          uv run python scripts/verify-acp-runtime.py
          uv run python scripts/verify-acp-processes.py
          uv run python scripts/verify-acp-generic-boundary.py
      - name: Verify published Pi runtime with a local model
        working-directory: connector
        shell: bash
        run: |
          for scenario in allow deny readonly attachment steer slow reasoning interrupt; do
            uv run python scripts/verify-pi-managed.py --scenario "$scenario" --cache-root "$RUNNER_TEMP/aa-pi-runtime-checks"
          done

  server:
    name: Server tests
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agents_anywhere_test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite truncates every table before each test; the name must contain "test".
      AGENT_SERVER_TEST_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agents_anywhere_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            connector/pyproject.toml
            server/pyproject.toml
      - name: Install Server dependencies and the Connector package
        # tests/test_connector_pipeline.py imports the Connector package, so it
        # and its dependencies have to live in the Server environment.
        run: |
          uv sync --project server
          uv pip install --python server/.venv/bin/python --editable ./connector
      - name: Check runtime workflow contracts
        working-directory: server
        run: uv run --no-sync python -m scripts.export_workflow_schemas --check
      - name: Restore test dependency baseline
        uses: actions/cache/restore@v4
        with:
          path: server/.testmondata*
          key: server-testmon-v1-${{ runner.os }}-${{ hashFiles('server/pyproject.toml', 'connector/pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            server-testmon-v1-${{ runner.os }}-${{ hashFiles('server/pyproject.toml', 'connector/pyproject.toml') }}-
      - name: Prepare optional benchmark function change
        if: github.event_name == 'workflow_dispatch' && inputs.server_sample_change
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          path = Path('server/agent_server/api/announcements.py')
          source = path.read_text()
          before = 'response.headers["Cache-Control"] = "no-store"'
          if before not in source:
              raise SystemExit('Benchmark anchor missing; no source modified')
          path.write_text(source.replace(before, before + '.strip()', 1))
          print('Benchmark only: harmless announcement function edit in disposable CI checkout')
          PYTHON
      - name: Test Server with selection shadow
        working-directory: server
        env:
          CHECK_BASE: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.base.sha || github.event.before }}
        run: uv run --no-sync python -m scripts.check_tests --mode "${{ inputs.server_mode || 'shadow' }}" --workers "${{ inputs.server_workers || '2' }}" --base "$CHECK_BASE"
      - name: Publish Server timing and selection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/.test-results/
      - name: Summarize Server checks
        if: always()
        working-directory: server
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path('.test-results/summary.json')
          if path.exists():
              data = json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('## Server test selection shadow\n\n')
                  out.write(f"Fallback: {data['fallback'] or 'none'}\n\n")
                  out.write('| Stage | Tests executed | Seconds | Exit |\n|---|---:|---:|---:|\n')
                  for stage in data['stages']:
                      count = len({r['id'] for r in stage['reports']})
                      out.write(f"| {stage['stage']} | {count} | {stage['wall_seconds']} | {stage['exit_code']} |\n")
                  if 'missed_failures' in data:
                      out.write(f"\nFast path reduction: {data['time_reduction_percent']}%; missed failing tests: {len(data['missed_failures'])}\n")
          PYTHON
      - name: Save successful test dependency baseline
        if: success()
        uses: actions/cache/save@v4
        with:
          path: server/.testmondata*
          key: server-testmon-v1-${{ runner.os }}-${{ hashFiles('server/pyproject.toml', 'connector/pyproject.toml') }}-${{ github.sha }}

  web:
    name: Web headless checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-next
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install client dependencies
        uses: ./.github/actions/setup-yarn
        with:
          project: web-next
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify Web
        run: |
          corepack yarn test
          node scripts/verify-runtime-workflows.mjs
          corepack yarn typecheck
          corepack yarn protocol:check

  desktop:
    name: Desktop headless checks
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-workbench
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install client dependencies
        uses: ./.github/actions/setup-yarn
        with:
          project: desktop-workbench
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify Desktop renderer and main process
        run: |
          corepack yarn workspace agents-anywhere-desktop-renderer test
          corepack yarn workspace agents-anywhere-desktop-renderer exec node scripts/verify-runtime-workflows.mjs
          corepack yarn renderer:typecheck
          corepack yarn workspace agents-anywhere-desktop-renderer protocol:check
          corepack yarn test:main
