name: CI

# One workflow for every headless-checkable component. The `changes` job looks
# at the changed paths and turns on only the jobs that can be affected,
# including downstream consumers: the DSH plugin tests execute Connector and
# Server code, and the Server tests import the Connector package.

on:
  pull_request:
  push:
    branches:
      - main
      - v2
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to execute
        type: choice
        options: [all, server]
        default: all
      server_workers:
        description: Verification workers (dependency recording uses at most 2)
        type: choice
        options: ['4', '2', '1']
        default: '4'
      server_mode:
        description: Full verification (default), or optional dependency recording/selection diagnostics
        type: choice
        options: [verify, full, shadow, affected]
        default: verify
      server_sample_change:
        description: Benchmark a harmless announcement function edit in this checkout
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  # This repository intentionally does not commit Yarn or uv lockfiles.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  # Headless checks do not need an Electron binary or dependency install scripts.
  YARN_ENABLE_SCRIPTS: "false"
  UV_DEFAULT_INDEX: https://pypi.org/simple
  UV_VERSION: 0.12.3
  PYTHON_VERSION: "3.12"
  NODE_VERSION: 22.23.2

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plugin: ${{ steps.paths.outputs.plugin }}
      connector: ${{ steps.paths.outputs.connector }}
      acp: ${{ steps.paths.outputs.acp }}
      server: ${{ steps.paths.outputs.server }}
      web: ${{ steps.paths.outputs.web }}
      desktop: ${{ steps.paths.outputs.desktop }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Select checks for changed paths
        id: paths
        shell: bash
        env:
          CHECK_SCOPE: ${{ inputs.scope }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          plugin=false
          connector=false
          acp=false
          server=false
          web=false
          desktop=false

          run_everything() {
            echo "::notice::$1; running every check"
            plugin=true
            connector=true
            acp=true
            server=true
            web=true
            desktop=true
          }

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$CHECK_SCOPE" == server ]]; then
              server=true
            else
              run_everything "manual run"
            fi
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            # A push that creates a branch has no `before` commit to diff against.
            run_everything "no base commit"
          else
            # Only the two commits are needed for a tree diff.
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths"
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/pi-compat.yml)
                  # Its own PR workflow verifies native Pi compatibility.
                  [[ -f "$path" ]] || run_everything "independent workflow removed: $path"
                  ;;
                .github/workflows/dsh-bridge.yml) plugin=true ;;
                .github/actions/setup-yarn/action.yml)
                  plugin=true; web=true; desktop=true ;;
                .github/workflows/*|.github/actions/*|contracts/*)
                  run_everything "shared file changed: $path"
                  ;;
                dsh-bridge-next/*) plugin=true ;;
                # Plugin integration tests run the Connector's DSH probe and the
                # Server tests import the Connector package.
                connector/scripts/verify-acp-runtime.py|connector/scripts/verify-acp-processes.py|connector/scripts/verify-acp-generic-boundary.py|connector/scripts/verify-pi-managed.py)
                  acp=true ;;
                connector/scripts/verify-pi-native.py)
                  # Verified by the separate Pi compatibility workflow.
                  ;;
                connector/*) connector=true; acp=true; server=true; plugin=true ;;
                server/*) server=true; plugin=true ;;
                web-next/*) web=true ;;
                desktop-workbench/*) desktop=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi

          for scope in plugin connector acp server web desktop; do
            echo "$scope=${!scope}" >> "$GITHUB_OUTPUT"
            echo "$scope: ${!scope}"
          done

  plugin:
    name: DSH plugin
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agents_anywhere_test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The plugin's integration tests run the Connector's DSH probes, which build
      # the Server in-process against a throwaway database (see server/tests/conftest.py).
      AGENT_SERVER_TEST_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agents_anywhere_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install plugin dependencies
        uses: ./.github/actions/setup-yarn
        with:
          project: dsh-bridge-next
          node-version: ${{ env.NODE_VERSION }}
        env:
          # Validate explicitly pinned DSH release candidates immediately after publication.
          YARN_NPM_MINIMAL_AGE_GATE: "0"
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            connector/pyproject.toml
            server/pyproject.toml
      - name: Prepare Python integration fixtures
        run: |
          uv sync --project connector
          uv sync --project server
          uv pip install --python server/.venv/bin/python --editable ./connector
      - name: Typecheck, build and test plugin
        working-directory: dsh-bridge-next
        env:
          # Nested Python probes reuse the prepared environments, without repeated resolution.
          UV_NO_SYNC: "true"
        run: corepack yarn check

  connector:
    name: Connector tests
    needs: changes
    if: needs.changes.outputs.connector == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: connector/pyproject.toml
      - name: Install Connector dependencies
        run: uv sync --project connector
      - name: Test Connector
        working-directory: connector
        # `timeout` ends a stalled run with the faulthandler stacks still in the
        # log; the job timeout alone would discard them.
        run: timeout --kill-after=30s 900 uv run --no-sync pytest -q --durations=20 -o faulthandler_timeout=120

  acp:
    name: ACP coordination (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.acp == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Connector dependencies
        run: uv sync --project connector
      - name: Verify actual ACP transport and ownership
        working-directory: connector
        shell: bash
        run: |
          uv run python scripts/verify-acp-runtime.py
          uv run python scripts/verify-acp-processes.py
          uv run python scripts/verify-acp-generic-boundary.py
      - name: Verify published Pi runtime with a local model
        working-directory: connector
        shell: bash
        run: |
          uv run --no-sync python scripts/verify-pi-managed.py --scenario all --cache-root "$RUNNER_TEMP/aa-pi-runtime-checks"

  server:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.server_mode != 'verify' && 'Server test diagnostics' || 'Server tests' }}
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agents_anywhere_test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite truncates every table before each test; the name must contain "test".
      AGENT_SERVER_TEST_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agents_anywhere_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            connector/pyproject.toml
            server/pyproject.toml
      - name: Install Server dependencies and the Connector package
        # tests/test_connector_pipeline.py imports the Connector package, so it
        # and its dependencies have to live in the Server environment.
        run: |
          uv sync --project server
          uv pip install --python server/.venv/bin/python --editable ./connector
      - name: Check runtime workflow contracts
        working-directory: server
        run: uv run --no-sync python -m scripts.export_workflow_schemas --check
      - name: Restore test dependency baseline
        if: github.event_name == 'workflow_dispatch' && inputs.server_mode != 'verify'
        uses: actions/cache/restore@v4
        with:
          path: server/.testmondata*
          key: server-testmon-v1-${{ runner.os }}-${{ hashFiles('server/pyproject.toml', 'connector/pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            server-testmon-v1-${{ runner.os }}-${{ hashFiles('server/pyproject.toml', 'connector/pyproject.toml') }}-
      - name: Prepare optional benchmark function change
        if: github.event_name == 'workflow_dispatch' && inputs.server_sample_change
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          path = Path('server/agent_server/api/announcements.py')
          source = path.read_text()
          before = 'response.headers["Cache-Control"] = "no-store"'
          if before not in source:
              raise SystemExit('Benchmark anchor missing; no source modified')
          path.write_text(source.replace(before, before + '.strip()', 1))
          print('Benchmark only: harmless announcement function edit in disposable CI checkout')
          PYTHON
      - name: Test Server
        working-directory: server
        env:
          CHECK_BASE: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.base.sha || github.event.before }}
        run: uv run --no-sync python -m scripts.check_tests --mode "${{ inputs.server_mode || 'verify' }}" --workers "${{ inputs.server_workers || '4' }}" --base "$CHECK_BASE"
      - name: Publish Server timing and selection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          include-hidden-files: true
          path: server/.test-results/
      - name: Summarize Server checks
        if: always()
        working-directory: server
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path('.test-results/summary.json')
          if path.exists():
              data = json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('## Server test report\n\n')
                  out.write(f"Fallback: {data['fallback'] or 'none'}\n\n")
                  out.write('| Stage | Workers | Tests executed | Seconds | Exit |\n|---|---:|---:|---:|---:|\n')
                  for stage in data['stages']:
                      count = len({r['id'] for r in stage['reports']})
                      out.write(f"| {stage['stage']} | {stage.get('workers', '?')} | {count} | {stage['wall_seconds']} | {stage['exit_code']} |\n")
                  if 'missed_failures' in data:
                      out.write(f"\nFast path reduction: {data['time_reduction_percent']}%; missed failing tests: {len(data['missed_failures'])}\n")
          PYTHON
      - name: Save successful test dependency baseline
        if: success() && github.event_name == 'workflow_dispatch' && inputs.server_mode != 'verify'
        uses: actions/cache/save@v4
        with:
          path: server/.testmondata*
          key: server-testmon-v1-${{ runner.os }}-${{ hashFiles('server/pyproject.toml', 'connector/pyproject.toml') }}-${{ github.sha }}

  mesh:
    name: Mesh transport probes
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .:../connector
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            connector/pyproject.toml
            server/pyproject.toml
      - name: Prepare transport probe environment
        working-directory: .
        run: |
          uv sync --project server
          uv pip install --python server/.venv/bin/python --editable ./connector
      - name: Check remote control contract
        run: uv run --no-sync python ../connector/tools/generate_remote_control.py --check
      - name: Check authenticated connection message budgets
        run: >-
          timeout --kill-after=30s 120 uv run --no-sync python -m tools.probe_connector_websocket_limits
          --output "$RUNNER_TEMP/mesh-websocket-limits"
      - name: Check control diagnostics and private-data boundaries
        run: >-
          timeout --kill-after=30s 60 uv run --no-sync python -m tools.probe_connector_control_logs
          --output "$RUNNER_TEMP/mesh-logs"
      - name: Check connection generations in Redis and memory
        run: >-
          timeout --kill-after=30s 120 uv run --no-sync python -m tools.probe_connector_mesh_state
          --redis-url redis://127.0.0.1:6379/15 --output "$RUNNER_TEMP/mesh-state"
      - name: Check request budgets and bounded diagnostic writes
        run: >-
          timeout --kill-after=30s 60 uv run --no-sync python -m tools.probe_connector_request_limits
          --output "$RUNNER_TEMP/mesh-request-limits"
      - name: Check HTTP control budgets and WS timeout isolation
        shell: bash
        run: |
          timeout --kill-after=30s 60 uv run --no-sync python -m tools.probe_connector_control_http \
            --redis-url redis://127.0.0.1:6379/15 --output "$RUNNER_TEMP/mesh-http" \
            2>&1 | tee "$RUNNER_TEMP/mesh-http.log"
      - name: Check proxy publication budgets and uncertain admission
        shell: bash
        run: |
          timeout --kill-after=30s 60 uv run --no-sync python -m tools.probe_connector_proxy_publication \
            --redis-url redis://127.0.0.1:6379/15 --output "$RUNNER_TEMP/mesh-publication" \
            2>&1 | tee "$RUNNER_TEMP/mesh-publication.log"
      - name: Check lost-route draining and scoped registration queries
        shell: bash
        run: |
          timeout --kill-after=30s 120 uv run --no-sync python -m tools.probe_connector_mesh_recovery \
            --redis-url redis://127.0.0.1:6379/15 --output "$RUNNER_TEMP/mesh-recovery" \
            2>&1 | tee "$RUNNER_TEMP/mesh-recovery.log"
      - name: Check large Redis envelopes and subscription recovery
        shell: bash
        run: |
          timeout --kill-after=30s 120 uv run --no-sync python -m tools.probe_connector_rpc_frames \
            --redis-url redis://127.0.0.1:6379/15 --output "$RUNNER_TEMP/mesh-frames" \
            2>&1 | tee "$RUNNER_TEMP/mesh-frames.log"
      - name: Check expiry fallback while bootstrap remains unavailable
        shell: bash
        run: |
          timeout --kill-after=30s 90 uv run --no-sync python -m tools.probe_connector_mesh_expiry \
            --output "$RUNNER_TEMP/mesh-expiry" \
            2>&1 | tee "$RUNNER_TEMP/mesh-expiry.log"
      - name: Check control admission and SDK shutdown
        shell: bash
        run: |
          timeout --kill-after=30s 60 uv run --no-sync python -m tools.probe_connector_control_shutdown \
            --output "$RUNNER_TEMP/mesh-shutdown" \
            2>&1 | tee "$RUNNER_TEMP/mesh-shutdown.log"
      - name: Check startup authorization and shutdown fault matrix
        shell: bash
        run: |
          timeout --kill-after=30s 90 uv run --no-sync python -m tools.probe_connector_control_edges \
            --output "$RUNNER_TEMP/mesh-edges" \
            2>&1 | tee "$RUNNER_TEMP/mesh-edges.log"
      - name: Check separated entrypoints and cross-Router recovery
        shell: bash
        run: |
          timeout --kill-after=30s 300 uv run --no-sync python tools/probe_connector_mesh.py \
            --redis-url redis://127.0.0.1:6379/15 \
            --redis-container "${{ job.services.redis.id }}" --output "$RUNNER_TEMP/mesh-distributed" \
            2>&1 | tee "$RUNNER_TEMP/mesh-distributed-connector.log"
      - name: Check cross-instance diagnostic correlation
        run: >-
          timeout --kill-after=30s 60 uv run --no-sync python -m tools.probe_connector_control_logs
          --transport-output "$RUNNER_TEMP/mesh-distributed"
          --connector-log "$RUNNER_TEMP/mesh-distributed-connector.log" --output "$RUNNER_TEMP/mesh-log-chain"
      - name: Check transport without Redis
        run: >-
          timeout --kill-after=30s 300 uv run --no-sync python tools/probe_connector_mesh.py
          --single-process --output "$RUNNER_TEMP/mesh-local"
      - name: Check overlapping authorization rotation across workers
        shell: bash
        run: |
          timeout --kill-after=30s 180 uv run --no-sync python -m tools.probe_connector_mesh_renewal \
            --redis-url redis://127.0.0.1:6379/15 --output "$RUNNER_TEMP/mesh-renewal" \
            2>&1 | tee "$RUNNER_TEMP/mesh-renewal-connector.log"
      - name: Check overlapping authorization rotation without Redis
        shell: bash
        run: |
          timeout --kill-after=30s 180 uv run --no-sync python -m tools.probe_connector_mesh_renewal \
            --output "$RUNNER_TEMP/mesh-renewal-local" \
            2>&1 | tee "$RUNNER_TEMP/mesh-renewal-local-connector.log"
      - name: Check cached authorization and cross-worker invalidation
        shell: bash
        run: |
          timeout --kill-after=30s 180 uv run --no-sync python -m tools.probe_connector_mesh_auth \
            --redis-url redis://127.0.0.1:6379/15 --output "$RUNNER_TEMP/mesh-auth" \
            2>&1 | tee "$RUNNER_TEMP/mesh-auth-connector.log"
      - name: Check safe fallback across workers and real local handlers
        shell: bash
        run: |
          timeout --kill-after=30s 180 uv run --no-sync python -m tools.probe_connector_fallback \
            --redis-url redis://127.0.0.1:6379/15 --output "$RUNNER_TEMP/mesh-fallback" \
            2>&1 | tee "$RUNNER_TEMP/mesh-fallback-connector.log"
      - name: Check safe fallback without Redis
        shell: bash
        run: |
          timeout --kill-after=30s 180 uv run --no-sync python -m tools.probe_connector_fallback \
            --output "$RUNNER_TEMP/mesh-fallback-local" \
            2>&1 | tee "$RUNNER_TEMP/mesh-fallback-local-connector.log"
      - name: Save transport results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mesh-transport-results
          path: |
            ${{ runner.temp }}/mesh-logs/results.json
            ${{ runner.temp }}/mesh-websocket-limits/results.json
            ${{ runner.temp }}/mesh-log-chain/results.json
            ${{ runner.temp }}/mesh-state/results.json
            ${{ runner.temp }}/mesh-request-limits/results.json
            ${{ runner.temp }}/mesh-http/results.json
            ${{ runner.temp }}/mesh-publication/results.json
            ${{ runner.temp }}/mesh-recovery/results.json
            ${{ runner.temp }}/mesh-frames/results.json
            ${{ runner.temp }}/mesh-expiry/results.json
            ${{ runner.temp }}/mesh-shutdown/results.json
            ${{ runner.temp }}/mesh-edges/results.json
            ${{ runner.temp }}/mesh-distributed/results.json
            ${{ runner.temp }}/mesh-local/results.json
            ${{ runner.temp }}/mesh-renewal/results.json
            ${{ runner.temp }}/mesh-renewal-local/results.json
            ${{ runner.temp }}/mesh-auth/results.json
            ${{ runner.temp }}/mesh-fallback/results.json
            ${{ runner.temp }}/mesh-fallback-local/results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Save failed transport probe logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-transport-failure-logs
          path: |
            ${{ runner.temp }}/mesh-distributed/process-*.log
            ${{ runner.temp }}/mesh-distributed-connector.log
            ${{ runner.temp }}/mesh-local/process-*.log
            ${{ runner.temp }}/mesh-renewal/process-*.log
            ${{ runner.temp }}/mesh-renewal-local/process-*.log
            ${{ runner.temp }}/mesh-renewal-connector.log
            ${{ runner.temp }}/mesh-renewal-local-connector.log
            ${{ runner.temp }}/mesh-auth/process-*.log
            ${{ runner.temp }}/mesh-auth-connector.log
            ${{ runner.temp }}/mesh-frames.log
            ${{ runner.temp }}/mesh-http.log
            ${{ runner.temp }}/mesh-publication.log
            ${{ runner.temp }}/mesh-recovery.log
            ${{ runner.temp }}/mesh-expiry.log
            ${{ runner.temp }}/mesh-expiry/process.log
            ${{ runner.temp }}/mesh-shutdown.log
            ${{ runner.temp }}/mesh-edges.log
            ${{ runner.temp }}/mesh-fallback/process-*.log
            ${{ runner.temp }}/mesh-fallback-local/process-*.log
            ${{ runner.temp }}/mesh-fallback-connector.log
            ${{ runner.temp }}/mesh-fallback-local-connector.log
          if-no-files-found: ignore
          retention-days: 3

  web:
    name: Web headless checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-next
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install client dependencies
        uses: ./.github/actions/setup-yarn
        with:
          project: web-next
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify Web
        run: |
          corepack yarn test
          node scripts/verify-runtime-workflows.mjs
          corepack yarn typecheck
          corepack yarn protocol:check

  desktop:
    name: Desktop headless checks
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-workbench
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install client dependencies
        uses: ./.github/actions/setup-yarn
        with:
          project: desktop-workbench
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify Desktop renderer and main process
        run: |
          corepack yarn workspace agents-anywhere-desktop-renderer test
          corepack yarn workspace agents-anywhere-desktop-renderer exec node scripts/verify-runtime-workflows.mjs
          corepack yarn renderer:typecheck
          corepack yarn workspace agents-anywhere-desktop-renderer protocol:check
          corepack yarn test:main
