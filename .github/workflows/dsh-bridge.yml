name: DSH Bridge

# PR/push verification lives in CI's DSH plugin job. This workflow prepares a
# package on demand and publishes only for the existing dsh-bridge-v* release tags.
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  NODE_VERSION: 22.23.2

jobs:
  verify:
    name: Verify and pack current plugin
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'dsh-bridge-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dsh-bridge-next
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install current plugin dependencies
        uses: ./.github/actions/setup-yarn
        with:
          project: dsh-bridge-next
          node-version: ${{ env.NODE_VERSION }}
        env:
          YARN_NPM_MINIMAL_AGE_GATE: "0"
      - name: Install TS Connector dependencies
        # The build bundles connector-ts into the package.
        uses: ./.github/actions/setup-yarn
        with:
          project: connector-ts
          node-version: ${{ env.NODE_VERSION }}
      # Any Go >= 1.21: the script pins the exact toolchain through GOTOOLCHAIN.
      - name: Set up Go for the MeshCall Router
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Build the MeshCall Router for every platform
        # Built from the pinned meshcall commit and checked against connector-ts/scripts/meshcall-router.json.
        working-directory: connector-ts
        run: |
          node scripts/fetch-router.mjs --all
          echo "MESHCALL_ROUTER_BINARY=$PWD/router/linux-x64/meshcall-router" >> "$GITHUB_ENV"
      - name: Typecheck, build and test plugin
        env:
          # The package carries the Router of every platform; the build fails if one is missing.
          DSH_BRIDGE_ROUTER_TARGETS: all
        run: corepack yarn check
      - name: Match release tag to package version
        if: github.event_name == 'release'
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "dsh-bridge-v${package_version}"
      - name: Pack verified build without rerunning prepack
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-bridge-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/dsh-bridge-package"
      - name: Save verified package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-bridge-package
          path: ${{ runner.temp }}/dsh-bridge-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified package
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'dsh-bridge-v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: dsh-bridge-package
          path: ${{ runner.temp }}/dsh-bridge-package
      - name: Publish with provenance
        run: npm publish "$RUNNER_TEMP/dsh-bridge-package/"*.tgz --ignore-scripts --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
