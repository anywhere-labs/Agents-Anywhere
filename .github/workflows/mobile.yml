name: Mobile CI

on:
  pull_request:
    paths:
      - android/**
      - ios/**
      - .github/workflows/mobile.yml
  push:
    branches:
      - main
    paths:
      - android/**
      - ios/**
      - .github/workflows/mobile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept SDK licenses and install required packages
        run: |
          # GitHub ubuntu runners preinstall the Android SDK with ANDROID_HOME
          # set; android-actions/setup-android@v3 has been failing immediately,
          # so rely on the preinstalled cmdline-tools instead.
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" > /dev/null
      - name: Set up Gradle caching and wrapper validation
        uses: gradle/actions/setup-gradle@v4
        with:
          # The wrapper is trusted as committed; checksum validation would need
          # a pinned distributionSha256Sum in gradle-wrapper.properties.
          validate-wrappers: false
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew
      - name: Show Gradle/toolchain versions
        working-directory: android
        run: ./gradlew --version
      - name: Assemble debug APK (compiles main sources)
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Run unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - name: Check release build compiles without signing
        working-directory: android
        run: ./gradlew :app:assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: ignore

  ios:
    name: iOS SwiftPM tests (macOS)
    # Package.swift requires swift-tools-version 6.2 and the iOS 26.5 SDK,
    # both of which only ship with Xcode 26.5 on the macOS 26 images.
    # macos-15 tops out at Xcode 16.x and cannot parse the manifest.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show available Xcode toolchains
        run: |
          ls /Applications | grep -i xcode || true
          xcode-select -p
          xcodebuild -version
          swift --version
      - name: Select newest Xcode
        # Package.swift requires swift-tools-version 6.2; pick the newest
        # installed toolchain so the runner default cannot silently fail.
        run: |
          NEWEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $NEWEST_XCODE"
          sudo xcode-select -s "$NEWEST_XCODE"
          xcodebuild -version
      - name: Run SwiftPM tests
        working-directory: ios
        run: swift test
