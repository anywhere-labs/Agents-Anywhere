name: Mobile CI

on:
  pull_request:
    paths:
      - android/**
      - ios/**
      - .github/workflows/mobile.yml
  push:
    branches:
      - main
    paths:
      - android/**
      - ios/**
      - .github/workflows/mobile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept SDK licenses and install required packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" > /dev/null
      - name: Set up Gradle caching and wrapper validation
        uses: gradle/actions/setup-gradle@v4
        with:
          # The wrapper is trusted as committed; checksum validation would need
          # a pinned distributionSha256Sum in gradle-wrapper.properties.
          validate-wrappers: false
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew
      - name: Show Gradle/toolchain versions
        working-directory: android
        run: ./gradlew --version
      - name: Assemble debug APK (compiles main sources)
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Run unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - name: Check release build compiles without signing
        working-directory: android
        run: ./gradlew :app:assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: ignore

  ios:
    name: iOS SwiftPM tests (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          xcode-select -p
          xcodebuild -version
      - name: Run SwiftPM tests
        working-directory: ios
        run: swift test
