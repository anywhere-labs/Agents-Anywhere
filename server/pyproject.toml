[project]
name = "agent-server"
version = "2.2.0"
description = "FastAPI backend for Agents Anywhere"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "claude-agent-sdk",
    "cryptography>=43.0.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "httpx-s3-client",
    "jsonschema>=4.26.0",
    "loguru>=0.7.3",
    "pillow>=11.0.0",
    "python-multipart>=0.0.20",
    # fakeredis (2.40.0) cannot create a client with redis-py 8.2.0, released 2026-11-23, so the tests fail.
    # Lift the cap once a fakeredis release supports it.
    "redis>=6.0.0,<8.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.47.0",
    "websockets>=16.0",
    "wsproto>=1.3.2",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.30.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pytest>=9.0.3",
    "pytest-testmon>=2.2,<3",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
httpx-s3-client = { git = "https://github.com/t4wefan/httpx-s3-client.git" }
