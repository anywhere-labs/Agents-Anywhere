[project]
name = "agent-server"
version = "2.1.0"
description = "FastAPI backend for Agents Anywhere"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "claude-agent-sdk",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "httpx-s3-client",
    "jsonschema>=4.26.0",
    "loguru>=0.7.3",
    "meshcall==0.3.0",
    "python-multipart>=0.0.20",
    "redis>=6.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    # The connection-budget adapter targets this SansIO backend and parser API.
    "uvicorn>=0.54.0,<0.55.0",
    "websockets>=17.3,<18.0",
    "wsproto>=1.3.2",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.30.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
explicit = true

[tool.uv.sources]
meshcall = { index = "pypi" }
httpx-s3-client = { git = "https://github.com/t4wefan/httpx-s3-client.git" }
