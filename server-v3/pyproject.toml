[project]
name = "aa-control-plane"
version = "3.0.0-alpha.1"
description = "Agents Anywhere v3 lightweight control plane (aa.v3.Control + FastAPI auth/OAuth/MCP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "cryptography>=43.0.0",
    "fastapi>=0.135.0",
    "httpx[http2]>=0.28.1",
    "loguru>=0.7.3",
    "meshcall>=0.4.0",
    "pydantic>=2.10.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.20",
    "redis>=6.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "fakeredis[lua]>=2.30.0",
    "jsonschema>=4.23.0",
    "psycopg[binary]>=3.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
